version: '3.8'

services:
  tutbot_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: tutbot:arm64
    container_name: tutbot_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    # Límites estrictos de hardware para Jetson Nano (compatibles con Compose v1 y v2)
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.5'
        reservations:
          memory: 256M
    networks:
      - tutbot_network

networks:
  tutbot_network:
    name: tutbot_network
    driver: bridge


services:
  tut-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tut-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    # Límites de memoria recomendados para correr ligero en Jetson Nano junto a otros contenedores
    deploy:
      resources:
        limits:
          memory: 512M

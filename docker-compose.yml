version: '2.2'

services:
  tutbot_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: tutbot:arm64
    container_name: tutbot_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    # Límites estrictos de hardware para Jetson Nano (Compose 1.17.1 & Compose v2)
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5

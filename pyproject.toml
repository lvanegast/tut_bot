[project]
name = "tut-bot"
version = "0.1.0"
description = "Entrenador Fonético Inteligente para Alemán e Inglés con Azure Speech SDK y Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-cognitiveservices-speech>=1.35.0",
    "fastapi>=0.110.0",
    "google-genai>=0.2.0",
    "imageio-ffmpeg>=0.6.0",
    "pydantic>=2.6.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
tut-bot = "tut_bot.main:start"
tut-bot-telegram = "tut_bot.services.telegram_bot:run_standalone"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tut_bot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
